<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uc live check</title>
<style>
  :root { --bg: #fbfbf9; --fg: #1d1d1b; --mute: #6e6e69; --line: #e4e3de; --ok: #1f7a4d; --bad: #c2322d; --bar: #9db8a8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ecebe6; --mute: #9a9993; --line: #2c2b28; --ok: #5cc28d; --bad: #f0645d; --bar: #4f7a63; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  main { max-width: 1040px; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 15px; margin: 30px 0 8px; font-weight: 600; }
  .sub { color: var(--mute); font-size: 14px; }
  .kpis { display: flex; flex-wrap: wrap; gap: 26px 40px; margin-top: 22px; }
  .kpi .n { font-size: 26px; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--mute); font-size: 13px; }
  .kpi .bad { color: var(--bad); }
  svg { width: 100%; height: 90px; display: block; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  td, th { text-align: left; padding: 5px 14px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: normal; }
  code { font: 12.5px ui-monospace, Menlo, monospace; }
  .ok { color: var(--ok); } .no { color: var(--bad); } .mute { color: var(--mute); }
  a { color: inherit; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>uc live check</h1>
  <div class="sub" id="sub">connecting…</div>
  <div class="kpis" id="kpis"></div>
  <h2>Blocks</h2>
  <div class="sub">One bar per block, height is transactions checked; red when uc disagreed or failed.</div>
  <svg id="plot" preserveAspectRatio="none"></svg>
  <h2>Disagreements</h2>
  <div class="scroll"><table id="bad"></table></div>
  <h2>Declared classes</h2>
  <div class="scroll"><table id="declares"></table></div>
  <p class="sub" id="log"></p>
</main>
<script>
const LABELS = {tx_hash: "Transaction hashes match", class_hash: "Class hashes match", casm_hash: "Compiled hashes match",
  audit: "Audits finished", trace: "Traces match", selector: "Decoded names match", call: "Calls match"};
const network = id => /^0x[0-9a-f]+$/i.test(id) ? id.slice(2).match(/../g).map(b => String.fromCharCode(parseInt(b, 16))).join("") : id;
const short = h => h && h.length > 16 ? h.slice(0, 10) + "…" + h.slice(-6) : h;
const fmt = n => (n || 0).toLocaleString("en-US");
function render(s) {
  const lag = s.head != null && s.last_block != null ? s.head - s.last_block : "?";
  document.getElementById("sub").textContent =
    `${s.uc} · ${network(s.network)} · checked to block ${fmt(s.last_block)} · head ${fmt(s.head)} · ${lag} behind · up ${Math.round(s.uptime_s / 60)} min${s.rpc_retries ? ` · ${fmt(s.rpc_retries)} rate-limited RPC retries` : ""}`;
  document.getElementById("kpis").innerHTML = Object.entries(LABELS).map(([k, label]) => {
    const c = s.counts[k] || {};
    const bad = (c.disagree || 0) + (c.uc_error || 0);
    return `<div class="kpi"><div class="n">${fmt(c.agree)}${bad ? ` <span class="bad">/ ${fmt(bad)} bad</span>` : ""}</div>` +
      `<div class="l">${label}${c.skip ? ` · ${fmt(c.skip)} skipped` : ""}</div></div>`;
  }).join("");
  const blocks = s.blocks, plot = document.getElementById("plot");
  const max = Math.max(1, ...blocks.map(b => b.txs)), w = 100 / Math.max(blocks.length, 1);
  plot.setAttribute("viewBox", "0 0 100 90");
  plot.innerHTML = blocks.map((b, i) => {
    const h = Math.max(1.5, 86 * b.txs / max);
    return `<rect x="${i * w}" y="${90 - h}" width="${Math.max(w - 0.15, 0.1)}" height="${h}" fill="var(${b.bad ? "--bad" : "--bar"})"><title>block ${b.n}: ${b.txs} txs${b.bad ? ", " + b.bad + " bad" : ""}</title></rect>`;
  }).join("");
  const bad = s.disagreements;
  document.getElementById("bad").innerHTML = bad.length
    ? "<tr><th>Check</th><th>Block</th><th>Item</th><th>What happened</th><th>Inputs</th></tr>" + bad.map(d =>
        `<tr><td>${LABELS[d.kind] || d.kind}</td><td>${fmt(d.block)}</td><td><code>${short(String(d.id))}</code></td>` +
        `<td class="no">${(d.outcome === "uc_error" ? "uc failed: " : "") + (d.detail || "").toString().slice(0, 220)}</td>` +
        `<td>${d.repro ? `<a href="/repro/${d.repro}">${d.repro.slice(0, 26)}</a>` : ""}</td></tr>`).join("")
    : '<tr><td class="ok">None so far: uc has agreed with the chain on every check.</td></tr>';
  const decl = s.declares;
  const mark = v => v === true ? '<span class="ok">matches</span>' : v === false ? '<span class="no">differs</span>' : `<span class="mute">${v || "?"}</span>`;
  document.getElementById("declares").innerHTML = decl.length
    ? "<tr><th>Block</th><th>Class</th><th>Sierra</th><th>Class hash</th><th>Compiled hash</th><th>Audit findings</th></tr>" + decl.map(d => {
        const a = d.audit, f = a && a.findings ? Object.entries(a.findings).map(([k, v]) => `${v} ${k}`).join(", ") || "none" : (a || "skipped");
        const sv = (d.sierra || []).map(x => parseInt(x, 16)).join(".");
        return `<tr><td>${fmt(d.block)}</td><td><code>${short(d.class_hash)}</code></td><td>${sv}</td><td>${mark(d.class_hash_ok)}</td><td>${mark(d.casm_hash_ok)}</td><td>${f}${a && a.ms ? ` <span class="mute">(${(a.ms / 1000).toFixed(1)} s)</span>` : ""}</td></tr>`;
      }).join("")
    : '<tr><td class="mute">No class declared since the run started.</td></tr>';
  document.getElementById("log").textContent = "Every check is logged to " + s.log;
}
async function tick() {
  try { render(await (await fetch("/state.json", {cache: "no-store"})).json()); } catch (e) { document.getElementById("sub").textContent = "checker not reachable"; }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
